name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    # Windows is not redundant here: atomic writes go through os.replace, and zoneinfo
    # has no system tz database to fall back on, so both differ from Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"

      - run: pytest
