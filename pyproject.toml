[project]
name = "draftbin"
version = "0.1.0"
description = "Self-hosted ephemeral publishing for agent-generated HTML and markdown"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["draftbin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
